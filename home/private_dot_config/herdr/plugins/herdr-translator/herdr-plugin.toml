id = "mrsmsn.translator"
name = "herdr-translator"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Translate selection/clipboard via translate-shell and show in a popup"
platforms = ["macos", "linux"]

[[actions]]
id = "translate"
title = "Translate"
contexts = ["pane"]
command = ["./translate.sh"]

# overlay は呼び出し元ペインの矩形内にしか描画されない (0.7.1)。
# tmux の display-popup のように全ペインの上へ出すには zoomed (タブ全域)。
[[panes]]
id = "popup"
title = "Translation"
placement = "zoomed"
command = ["./render.sh"]
