# Initial Mode
# fcitx5 の Activate (右Alt 単押し) で IME を有効化したとき、Mozc をひらがな入力で
# 開始する。Direct のままだと有効化しても英数のままで「かな」にならない。
InitialMode=Hiragana
# Shared Input State
InputState="Follow Global Configuration"
# Vertical candidate list
Vertical=True
# Expand Usage (Requires vertical candidate list)
ExpandMode="On Focus"
# Fix embedded preedit cursor at the beginning of the preedit
PreeditCursorPositionAtBeginning=False
# Hotkey to expand usage
ExpandKey=Control+Alt+H
