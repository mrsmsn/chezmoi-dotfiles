# 情報表示 (ディレクトリ/git/言語) は tmux のペインボーダー (tmux/pane-border.sh) に
# 移譲したため、プロンプトは時刻のみ表示する。
format = """
[░▒▓](#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1d2230"
format = '[[  $time ](fg:#a0a9cb bg:#1d2230)]($style)'
