name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: bash -n install.sh
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: zsh syntax check
        run: |
          for f in home/dot_zshrc home/private_dot_config/zsh/*.zsh; do
            zsh -n "$f"
          done
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          # .tmpl files under home/ are chezmoi templates, not pure shell.
          # nix/ contains Nix expressions, not shell.
          ignore_paths: home nix

  flake-check:
    # macOS runner is intentionally omitted here; see issue for re-enabling
    # macOS CI. darwinConfigurations is still evaluated on ubuntu so eval-
    # time errors in the darwin module are still caught.
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: nix flake check
        working-directory: nix
        env:
          USER: runner
        run: nix flake check --impure --no-build

  build-configs:
    # darwinConfigurations.default is intentionally not built here (requires
    # macOS runner). See the issue for re-enabling macOS CI.
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: homeConfigurations.linux
            attr: homeConfigurations.linux.activationPackage
          - label: homeConfigurations.wsl
            attr: homeConfigurations.wsl.activationPackage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: nix build
        working-directory: nix
        env:
          USER: runner
        run: nix build --impure --no-link --print-build-logs ".#${{ matrix.attr }}"

  template-variants:
    name: .chezmoi.toml.tmpl variant detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Install chezmoi
        run: nix profile install nixpkgs#chezmoi
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run template_variants bats
        # PROJECT_ROOT is exported so ci/test/helpers/common.bash skips the
        # /repo fallback meant for the Podman container path.
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: ./ci/run-bats.sh ci/test/template_variants.bats

  template-shellcheck:
    name: shellcheck rendered shell templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Install chezmoi and shellcheck
        run: nix profile install nixpkgs#chezmoi nixpkgs#shellcheck
      - name: Render and shellcheck each variant
        # run_onchange_20-* は `{{ output "git" ... }}` や `{{ .chezmoi.sourceDir }}`
        # を使うので単発レンダリングが面倒 (E2E は bootstrap-linux ジョブで cover)。
        # run_onchange_30 は chezmoi data を消費するので別途 test config を渡す。
        run: |
          set -euo pipefail
          variant_templates=(
            home/dot_zprofile.tmpl
            home/dot_claude/hooks/executable_notify-complete.sh.tmpl
            home/dot_claude/hooks/executable_notify-waiting.sh.tmpl
          )
          for variant in darwin linux wsl; do
            for tmpl in "${variant_templates[@]}"; do
              echo "=== variant=${variant} ${tmpl} ==="
              rendered=$(sed "s|\.variant|\"${variant}\"|g" "$tmpl" | chezmoi execute-template)
              if [[ -z "${rendered//[[:space:]]/}" ]]; then
                echo "(empty after rendering — skip)"
                continue
              fi
              echo "${rendered}" | shellcheck -s bash -
            done
          done

          test_config=$(mktemp --suffix=.toml)
          cat > "${test_config}" <<'EOF'
          [data]
          [data.git]
              gh_user_default = "test"
          [data.ghq]
              root = "~/src"
          [data.work]
              gitdir_prefix = "~/src/github.com/TEST/"
              gh_user = "test-work"
          EOF
          data_templates=(
            home/run_onchange_30-write-envrcs.sh.tmpl
          )
          for tmpl in "${data_templates[@]}"; do
            echo "=== ${tmpl} (work ON test config) ==="
            rendered=$(chezmoi --config "${test_config}" execute-template < "${tmpl}")
            echo "${rendered}" | shellcheck -s bash -
          done
          rm -f "${test_config}"

  git-profile:
    name: gitdir-based work プロファイル切替の E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Install chezmoi
        run: nix profile install nixpkgs#chezmoi
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run git-profile bats
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: ./ci/run-bats.sh ci/test/git_profile.bats

  bats-unit:
    # Nix 不要な bats を 1 job に集約。template_variants / git_profile は
    # Nix install 動線も検証したいので既存 job のまま据え置き、ここでは
    # install_unit / local_ci_hook / nix_tree_hash / install_e2e を流す。
    name: bats unit + lite E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and chezmoi
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin
      - name: Run bats unit/E2E suite
        env:
          PROJECT_ROOT: ${{ github.workspace }}
        run: |
          ./ci/run-bats.sh \
            ci/test/install_unit.bats \
            ci/test/local_ci_hook.bats \
            ci/test/nix_tree_hash.bats \
            ci/test/install_e2e.bats \
            ci/test/envrcs.bats

  bootstrap-linux:
    name: End-to-end bootstrap on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh against the local checkout
        # GITHUB_TOKEN is forwarded so install.sh can write it into
        # /etc/nix/nix.conf, which the nix-daemon reads when fetching
        # flake inputs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./install.sh "file://${GITHUB_WORKSPACE}"
      - name: Persist Nix paths for subsequent steps
        run: |
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Verify variant is "linux"
        run: |
          variant=$(chezmoi data | jq -r .variant)
          echo "variant=${variant}"
          test "${variant}" = "linux"
      - name: Second apply is idempotent
        run: |
          chezmoi apply
          status=$(chezmoi status)
          if [[ -n "${status}" ]]; then
            echo "Dirty after second apply:" >&2
            echo "${status}" >&2
            exit 1
          fi
      - name: Smoke test that zsh sources .zshrc cleanly
        # zsh -i so that .zshrc (and through it every split module) is sourced.
        # TMUX is faked so tmux_automatically_attach_session returns early
        # instead of trying to attach inside a non-TTY CI step.
        run: TMUX=fake zsh -i -c 'exit 0'
      - name: Verify LazyVim bootstraps headlessly
        # `Lazy! sync` の `!` は同期実行を強制する。初回起動時に
        # lua/config/lazy.lua が lazy.nvim を clone し、続けて LazyVim
        # 本体とその依存プラグインを `~/.local/share/nvim/lazy/` に
        # 展開しきることをアサートする。timeout は plugin clone と
        # treesitter コンパイルを含めても 10 分で十分余裕がある想定。
        run: |
          timeout 600 nvim --headless "+Lazy! sync" +qa
          test -d "${HOME}/.local/share/nvim/lazy/lazy.nvim"
          test -d "${HOME}/.local/share/nvim/lazy/LazyVim"
