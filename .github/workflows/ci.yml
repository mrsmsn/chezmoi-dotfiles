name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: bash -n install.sh
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: zsh syntax check
        run: |
          for f in home/dot_zshrc home/private_dot_config/zsh/*.zsh; do
            zsh -n "$f"
          done
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          # .tmpl files under home/ are chezmoi templates, not pure shell.
          # nix/ contains Nix expressions, not shell.
          ignore_paths: home nix

  flake-check:
    # macOS runner is intentionally omitted here; see issue for re-enabling
    # macOS CI. darwinConfigurations is still evaluated on ubuntu so eval-
    # time errors in the darwin module are still caught.
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: nix flake check
        working-directory: nix
        env:
          USER: runner
        run: nix flake check --impure --no-build

  build-configs:
    # darwinConfigurations.default is intentionally not built here (requires
    # macOS runner). See the issue for re-enabling macOS CI.
    name: build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: homeConfigurations.linux
            attr: homeConfigurations.linux.activationPackage
          - label: homeConfigurations.wsl
            attr: homeConfigurations.wsl.activationPackage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: nix build
        working-directory: nix
        env:
          USER: runner
        run: nix build --impure --no-link --print-build-logs ".#${{ matrix.attr }}"

  template-variants:
    name: .chezmoi.toml.tmpl variant detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: Install chezmoi
        run: nix profile install nixpkgs#chezmoi
      - name: Assert template produces expected variant for each simulated env
        run: |
          set -euo pipefail

          check() {
            local os="$1" osrelease="$2" expected_variant="$3" expected_machine="$4" result
            result=$(sed \
              -e "s|\.chezmoi\.kernel\.osrelease|\"${osrelease}\"|g" \
              -e "s|\.chezmoi\.os|\"${os}\"|g" \
              home/.chezmoi.toml.tmpl | chezmoi execute-template)
            echo "--- os=${os} osrelease=${osrelease} ---"
            echo "${result}"
            if ! echo "${result}" | grep -q "variant = \"${expected_variant}\""; then
              echo "FAIL: expected variant=\"${expected_variant}\"" >&2
              exit 1
            fi
            if ! echo "${result}" | grep -q "machine = \"${expected_machine}\""; then
              echo "FAIL: expected machine=\"${expected_machine}\"" >&2
              exit 1
            fi
          }

          # Runner is Linux, so `sysctl -n hw.model` fails inside the template
          # for every case; the sh-wrapped fallback should leave machine="".
          # Real Mac mini detection is only exercised on the user's hardware.
          check darwin "irrelevant"                         darwin ""
          check linux  "6.5.0-1014-azure"                   linux  ""
          check linux  "5.15.0-microsoft-standard-WSL2"     wsl    ""

  bootstrap-linux:
    name: End-to-end bootstrap on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh against the local checkout
        # GITHUB_TOKEN is forwarded so install.sh can write it into
        # /etc/nix/nix.conf, which the nix-daemon reads when fetching
        # flake inputs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./install.sh "file://${GITHUB_WORKSPACE}"
      - name: Persist Nix paths for subsequent steps
        run: |
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Verify variant is "linux"
        run: |
          variant=$(chezmoi data | jq -r .variant)
          echo "variant=${variant}"
          test "${variant}" = "linux"
      - name: Second apply is idempotent
        run: |
          chezmoi apply
          status=$(chezmoi status)
          if [[ -n "${status}" ]]; then
            echo "Dirty after second apply:" >&2
            echo "${status}" >&2
            exit 1
          fi
      - name: Smoke test that zsh sources .zshrc cleanly
        # zsh -i so that .zshrc (and through it every split module) is sourced.
        # TMUX is faked so tmux_automatically_attach_session returns early
        # instead of trying to attach inside a non-TTY CI step.
        run: TMUX=fake zsh -i -c 'exit 0'
