name: Update flake.lock

on:
  schedule:
    # 月・木 06:00 JST (= 日・水 21:00 UTC)
    - cron: "0 21 * * 0,3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # 後段の "Trigger CI on the update branch" が workflow_dispatch API を叩くため
  actions: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    env:
      # PAT (FLAKE_UPDATE_TOKEN) があればそれで PR を作る。default の
      # GITHUB_TOKEN で作った PR は pull_request イベントを発火しない
      # (GitHub の再帰防止) ので、その場合は後段で CI を手動 dispatch する。
      HAS_PAT: ${{ secrets.FLAKE_UPDATE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # 素の `nix flake update` (DeterminateSystems/update-flake-lock) ではなく
      # just nix-update を使う: llm-agents/nixpkgs と root nixpkgs の再 pin が
      # 走らないと、numtide / niri の各バイナリキャッシュと derivation hash が
      # ずれて cache miss + eval 破壊を bot PR が持ち込むため (justfile 参照)。
      - name: Run just nix-update
        run: nix shell nixpkgs#just nixpkgs#jq --command just nix-update
      - name: Open PR
        id: update
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}
          branch: update-flake-lock
          title: "chore: update nix/flake.lock"
          commit-message: "chore: update nix/flake.lock"
          labels: dependencies
          add-paths: nix/flake.lock
      - name: Trigger CI on the update branch
        if: env.HAS_PAT != 'true' && steps.update.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref update-flake-lock
